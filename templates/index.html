<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ conf.event_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='booth.css') }}">
</head>
<body class="booth">
  <!-- schwebende Party-Deko im Hintergrund -->
  <div class="floaties" aria-hidden="true">
    <span>🎉</span><span>✨</span><span>🎈</span><span>🥳</span><span>📸</span><span>💃</span>
    <span>🕺</span><span>🍾</span><span>⭐</span><span>🎶</span><span>🎊</span><span>💖</span>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="galleryBtn" title="Galerie">🖼️</button>
    <h1 class="title" id="eventName">{{ conf.event_name }}</h1>
    <a class="icon-btn" href="/settings" title="Einstellungen">⚙️</a>
  </header>

  <!-- Live-Ansicht -->
  <section id="liveScreen" class="screen active">
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <img id="dslrView" alt="" hidden>
      <div id="shotBadge" class="shot-badge" hidden></div>
      <div id="countdown" class="countdown" hidden><span id="countNum"></span><small id="countPhrase"></small></div>
      <div id="flash" class="flash"></div>
      <div id="cameraMessage" class="message" hidden></div>
      <div id="shotThumbs" class="shot-thumbs"></div>
    </div>

    <div class="controls">
      <div id="layoutPicker" class="layout-picker"></div>
      <button id="frameBtn" class="frame-btn" hidden><span>🖼️</span><small>Rahmen</small><b id="frameName"></b></button>
      <button id="shutterBtn" class="shutter"><span class="shutter-icon">📸</span><span>Los geht's!</span></button>
    </div>
  </section>

  <!-- Vorschau nach der Aufnahme -->
  <section id="reviewScreen" class="screen">
    <div class="review-stage"><img id="reviewImg" class="review-photo" alt="Euer Foto"></div>
    <div class="actions">
      <div id="printGroup" class="print-group">
        <button class="round-btn" id="copiesMinus" aria-label="weniger">−</button>
        <span id="copies">1</span>
        <button class="round-btn" id="copiesPlus" aria-label="mehr">+</button>
        <button class="pill pink" id="printBtn">🖨️ Drucken</button>
      </div>
      <button class="pill blue" id="shareBtn">📲 Aufs Handy</button>
      <button class="pill ghost" id="againBtn">🔁 Nochmal!</button>
    </div>
  </section>

  <!-- Galerie -->
  <section id="galleryScreen" class="screen">
    <div class="gallery-head">
      <h2>Eure Fotos 💖</h2>
      <button class="pill ghost" id="galleryClose">Zurück</button>
    </div>
    <div id="gallery" class="gallery"></div>
  </section>

  <!-- Teilen-Dialog -->
  <div id="shareModal" class="modal" hidden>
    <div class="modal-box">
      <h2>Hol dir dein Foto! 📲</h2>
      <p>QR-Code mit der Handykamera scannen</p>
      <img id="shareQr" alt="QR-Code">
      <p class="link" id="shareLink"></p>
      <button class="pill blue" id="shareClose">Fertig</button>
    </div>
  </div>

  <!-- Rahmen-Galerie für Gäste -->
  <div id="frameModal" class="modal" hidden>
    <div class="frame-box">
      <h2>Wähle deinen Rahmen ✨</h2>
      <div id="frameGrid" class="frame-grid"></div>
      <button class="pill blue" id="frameClose">Fertig</button>
    </div>
  </div>

  <!-- «Wird gezaubert» während das Layout erstellt wird -->
  <div id="busyOverlay" class="busy" hidden><div class="spinner">✨</div><p>Wird gezaubert …</p></div>

  <canvas id="confetti" class="confetti"></canvas>
  <div id="toast" class="toast" hidden></div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
